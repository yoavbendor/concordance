<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concordance: Tanakh</title>
<style>
  :root { color-scheme: light dark; --fg:#1b1b1b; --bg:#fbfaf7; --muted:#6b6b6b; --accent:#2a5db0; --rule:#d9d6cf; --chip:#ece9e2; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e6e1; --bg:#16161a; --muted:#9a9a9a; --accent:#7aa7ff; --rule:#34343b; --chip:#26262c; } }
  body { margin:0; padding:16px; font:17px/1.7 "SBL Hebrew","Frank Ruehl CLM","David",serif; color:var(--fg); background:var(--bg); }
  h1 { font-size:1.2rem; margin:0 0 12px; font-family:system-ui,sans-serif; }
  input[type=search] { width:100%; box-sizing:border-box; font:inherit; padding:10px 12px; border:1px solid var(--rule); border-radius:8px; background:transparent; color:var(--fg); }
  .modes { display:flex; gap:8px; margin:10px 0; font:15px system-ui,sans-serif; }
  .modes button { font:inherit; padding:6px 12px; border-radius:999px; border:1px solid var(--rule); background:var(--chip); color:var(--fg); cursor:pointer; }
  .modes button[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .device { font:15px system-ui,sans-serif; margin:4px 0 8px; color:var(--muted); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .device input { width:18px; height:18px; }
  #status { color:var(--muted); font:14px system-ui,sans-serif; margin:8px 0; min-height:1.2em; }
  .verse { border-top:1px solid var(--rule); padding:10px 0; }
  .ref { font:14px system-ui,sans-serif; color:var(--accent); }
  .score { font:13px system-ui,sans-serif; color:var(--muted); margin-inline-start:8px; }
  .he { margin:4px 0; }
  .xrefs { font:14px system-ui,sans-serif; color:var(--muted); margin-top:6px; }
  .xrefs button { all:unset; cursor:pointer; color:var(--accent); margin-inline-start:8px; }
  mark { background:transparent; color:var(--accent); font-weight:700; }
  .ref.link { cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
  .reader-nav { display:flex; gap:8px; align-items:center; font:15px system-ui,sans-serif; margin:8px 0; flex-wrap:wrap; }
  .reader-nav button { font:inherit; padding:6px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--chip); color:var(--fg); }
  .reader-nav button:disabled { opacity:.4; }
  .reader-nav .title { flex:1; text-align:center; font-weight:600; }
  .vline { padding:4px 6px; border-radius:6px; }
  .vline .vnum { font:13px system-ui,sans-serif; color:var(--muted); margin-inline-end:6px; }
  .vline.focus { background:rgba(42,93,176,.14); }
  .en { font:15px/1.5 system-ui,sans-serif; color:var(--muted); direction:ltr; text-align:left; margin-top:2px; }
  body.hide-en .en { display:none; }
  #logpanel { margin-top:24px; border-top:2px solid var(--rule); padding-top:8px; font:14px system-ui,sans-serif; }
  #logpanel summary { cursor:pointer; color:var(--accent); font-weight:600; }
  #logpanel .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
  #logpanel button { font:14px system-ui,sans-serif; padding:6px 10px; border-radius:8px; border:1px solid var(--rule); background:var(--chip); color:var(--fg); }
  #logbox { direction:ltr; text-align:left; white-space:pre-wrap; word-break:break-all; font:12px/1.4 ui-monospace,Menlo,monospace; max-height:50vh; overflow:auto; background:var(--chip); padding:8px; border-radius:8px; margin:0; }
  #crashbanner { display:none; background:#fff3cd; color:#664d03; padding:8px 10px; border-radius:8px; margin:8px 0; font:14px system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) { #crashbanner { background:#3a3112; color:#ffe69c; } }
</style>
</head>
<body>
<h1>Concordance: Tanakh</h1>
<input id="q" type="search" placeholder="Hebrew word" autocomplete="off" aria-label="Search">
<div class="modes">
  <button id="mode-word" aria-pressed="true">Word</button>
  <button id="mode-meaning" aria-pressed="false">Meaning (English, experimental)</button>
</div>
<label class="device"><input id="use-gpu" type="checkbox"> GPU (WebGPU) for meaning search; off = CPU</label>
<label class="device"><input id="show-en" type="checkbox" checked> Show the English translation</label>
<div id="status">Loading…</div>
<div id="results"></div>
<div id="crashbanner"></div>
<details id="logpanel">
  <summary>Log (survives crashes)</summary>
  <div class="row">
    <button id="log-copy">Copy log</button>
    <button id="log-prev">Show last session's log</button>
    <button id="log-clear">Clear log</button>
  </div>
  <pre id="logbox"></pre>
</details>
<script type="module">
"use strict";
import { buildIndex, rankWords, queryKeys, consonants } from "./search.js";
import { AutoTokenizer, env } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1";

const MODEL = "onnx-community/embeddinggemma-2-ONNX";
// Only the text model is loaded. The repo's vision and audio encoders (about 300 MB more)
// are never used for search, and loading them crashed the page on iPhone.
const ORT_VERSION = "1.31.0-dev.20260914-8d85527a0";
const ORT_CPU = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort.wasm.min.mjs`;
const ORT_GPU = `https://cdn.jsdelivr.net/npm/onnxruntime-web@${ORT_VERSION}/dist/ort.webgpu.min.mjs`;
// The device choice is saved per browser and applied on reload, so only one runtime loads.
const USE_GPU = (() => { try { return localStorage.getItem("concordance-gpu") === "1"; } catch (e) { return false; } })();
const MODEL_BASE = "https://huggingface.co/onnx-community/embeddinggemma-2-ONNX/resolve/main/onnx/";
const DIM = 256;                        // Matryoshka truncation, as in scripts/embed_verses.py
const DOCUMENT_PREFIX = "title: none | text: ";
const QUERY_PREFIX = "task: search result | query: ";

// ---- Persistent log -------------------------------------------------------
// Every line is written to localStorage as it happens, so it survives a tab crash or a
// reload. A run that never reached pagehide is marked as having crashed on the next load.
const LOG_KEY = "concordance-log", PREV_KEY = "concordance-log-prev", RUN_KEY = "concordance-running";
const LOG_MAX = 200000;          // characters kept per session
const lines = [];
let logSize = 0, persistTimer = null, prevLog = "", prevCrashed = false;

function store(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* quota or private mode */ } }
function fetchStore(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }

function describe(x) {
  if (x === undefined) return "";
  if (x instanceof Error) return `${x.name}: ${x.message}\n${x.stack || ""}`;
  if (typeof x === "string") return x;
  try { return JSON.stringify(x); } catch (e) { return String(x); }
}

function persistNow() {
  persistTimer = null;
  store(LOG_KEY, lines.join("\n"));
}

function log(level, msg, detail) {
  const text = `${new Date().toISOString()} ${level} ${msg}${detail !== undefined ? " " + describe(detail) : ""}`;
  lines.push(text);
  logSize += text.length + 1;
  while (logSize > LOG_MAX && lines.length > 1) logSize -= lines.shift().length + 1;
  // Errors and stage markers are written at once; the rest are batched to keep the page fast.
  if (level === "ERROR" || level === "STAGE") { if (persistTimer) clearTimeout(persistTimer); persistNow(); }
  else if (!persistTimer) persistTimer = setTimeout(persistNow, 1500);
  if (document.getElementById("logpanel")?.open) renderLog();
}

function renderLog() {
  document.getElementById("logbox").textContent = lines.join("\n");
}

// Mirror console warnings and errors into the log, keeping the console output too.
for (const level of ["warn", "error"]) {
  const original = console[level].bind(console);
  console[level] = (...args) => {
    log(level === "error" ? "ERROR" : "WARN", "console." + level, args.map(describe).join(" | "));
    original(...args);
  };
}
window.addEventListener("error", e => {
  log("ERROR", `uncaught: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, e.error || undefined);
});
window.addEventListener("unhandledrejection", e => {
  log("ERROR", "unhandled promise rejection", e.reason);
});

// Mark a crash: the flag is still set from the last run, and pagehide never cleared it.
prevLog = fetchStore(LOG_KEY);
prevCrashed = fetchStore(RUN_KEY) === "1";
store(PREV_KEY, prevLog);
store(RUN_KEY, "1");
window.addEventListener("pagehide", () => { log("INFO", "page hidden or closed"); persistNow(); store(RUN_KEY, "0"); });
setInterval(() => {
  const m = performance.memory ? ` heap=${Math.round(performance.memory.usedJSHeapSize / 1e6)}MB` : "";
  log("HEART", `alive${m} visible=${document.visibilityState}`);
}, 10000);

log("STAGE", "page start", {
  url: location.href, ua: navigator.userAgent, platform: navigator.platform,
  cores: navigator.hardwareConcurrency, memoryGB: navigator.deviceMemory,
  screen: `${screen.width}x${screen.height}@${devicePixelRatio}`,
  webgpu: "gpu" in navigator, online: navigator.onLine,
});
if (prevCrashed) {
  log("STAGE", "previous session did not close cleanly (crash, reload or kill); its log is kept");
  const banner = document.getElementById("crashbanner");
  banner.style.display = "block";
  document.getElementById("logpanel").open = true;   // open the log so it can be copied at once
  banner.textContent = "The last session ended without closing cleanly. Its log is kept: press \"Show last session's log\" under Log and copy it.";
}

let data = null, words = null, xrefs = null, byId = null, vectors = null;
let extractor = null, mode = "word", lastQuery = "";
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const input = document.getElementById("q");

// float16 bit pattern -> number
function halfToFloat(h) {
  const s = h & 0x8000 ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
  if (e === 0) return s * 2 ** -14 * (f / 1024);
  if (e === 31) return f ? NaN : s * Infinity;
  return s * 2 ** (e - 15) * (1 + f / 1024);
}

async function loadData() {
  const t0 = performance.now();
  log("STAGE", "loading data files");
  const [t, w, x, en] = await Promise.all([
    fetch("data/tanakh.json").then(r => r.json()),
    fetch("data/words.json").then(r => r.json()),
    fetch("data/xrefs.json").then(r => r.json()),
    fetch("data/english.json").then(r => r.json()),
  ]);
  // The English vectors are optional: without them, word search still works.
  const vbuf = await fetch("data/english_vectors.f16").then(r => (r.ok ? r.arrayBuffer() : null)).catch(() => null);
  data = t; words = w; xrefs = x; english = en;
  searchIndex = buildIndex(t, w, CANON_INDEX);
  buildChapters();
  byId = new Map(data.verses.map((v, i) => [v.id, i]));
  if (vbuf) {
    const half = new Uint16Array(vbuf);
    vectors = new Float32Array(half.length);
    for (let i = 0; i < half.length; i++) vectors[i] = halfToFloat(half[i]);
  } else {
    log("WARN", "English vectors not published; meaning search is off");
  }
  log("STAGE", "data ready", { verses: data.verses.length, xrefs: xrefs.length, vectorBytes: vbuf ? vbuf.byteLength : 0, ms: Math.round(performance.now() - t0) });
  statusEl.textContent = `${data.verses.length} verses · ${xrefs.length} cross-references`;
}

// Load the text model only, on first use: the CPU (WASM) or GPU (WebGPU) runtime,
// as chosen with the checkbox. There is no silent fallback, so a failure shows.
// The weights are kept in the browser's cache storage, so a later visit does not download
// them again. One load runs at a time; a second search waits for the first.
const WEIGHTS_URL = MODEL_BASE + "model_q4.onnx_data";
const WEIGHTS_CACHE = "concordance-model-v1";
let tokenizer = null, ort = null, loading = null;

// Weights as a blob: from the cache when present, else downloaded with progress and stored.
async function weightsBlob() {
  let cache = null;
  try { cache = await caches.open(WEIGHTS_CACHE); } catch (e) { log("WARN", "no cache storage", e); }
  const hit = cache ? await cache.match(WEIGHTS_URL) : null;
  if (hit) {
    const blob = await hit.blob();
    log("INFO", "weights from cache", { mb: Math.round(blob.size / 1e6) });
    return blob;
  }
  const res = await fetch(WEIGHTS_URL);
  if (!res.ok) throw new Error(`weights download failed: HTTP ${res.status}`);
  const total = Number(res.headers.get("content-length")) || 174028800;
  const reader = res.body.getReader();
  const chunks = [];
  let got = 0, lastStep = -1;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    got += value.length;
    const step = Math.floor((got / total) * 10);
    if (step !== lastStep) {
      lastStep = step;
      statusEl.textContent = `Loading the model… ${step * 10}% (keep this page open)`;
      log("INFO", "weights download", { percent: step * 10, mb: Math.round(got / 1e6) });
    }
  }
  const blob = new Blob(chunks, { type: "application/octet-stream" });
  if (cache) {
    try { await cache.put(WEIGHTS_URL, new Response(blob)); log("INFO", "weights cached"); }
    catch (e) { log("WARN", "cache write failed", e); }
  }
  return blob;
}

function loadModel() {
  if (!loading) {
    loading = doLoadModel().catch(e => { loading = null; throw e; });
  }
  return loading;
}

async function doLoadModel() {
  if (extractor) return extractor;
  env.allowLocalModels = false;
  const t0 = performance.now();
  const provider = USE_GPU ? "webgpu" : "wasm";
  log("STAGE", "loading text model", { model: "model_q4.onnx", provider });
  if (!tokenizer) tokenizer = await AutoTokenizer.from_pretrained(MODEL);
  if (!ort) ort = await import(USE_GPU ? ORT_GPU : ORT_CPU);
  const blob = await weightsBlob();
  const weightsUrl = URL.createObjectURL(blob);
  log("STAGE", "runtime and weights ready", { provider, ms: Math.round(performance.now() - t0) });
  statusEl.textContent = "Loading the model into memory…";
  try {
    extractor = await ort.InferenceSession.create(MODEL_BASE + "model_q4.onnx", {
      externalData: [{ path: "model_q4.onnx_data", data: weightsUrl }],
      executionProviders: [provider],
    });
  } catch (e) {
    log("ERROR", `text model failed on ${provider}`, e);
    throw new Error(`the text model did not start on ${provider}; untick the GPU box to use the CPU`);
  } finally {
    URL.revokeObjectURL(weightsUrl);
  }
  log("STAGE", "text model ready", { provider, ms: Math.round(performance.now() - t0) });
  return extractor;
}

// Query vector: prompt, mean-pooled sentence embedding, truncate to DIM, renormalize
// (the same vectors as scripts/embed_verses.py, up to the q4 weights).
async function embedQuery(text) {
  const session = await loadModel();
  const t0 = performance.now();
  const enc = await tokenizer(QUERY_PREFIX + text.trim().split(/\s+/).join(" "));
  const n = enc.input_ids.dims[enc.input_ids.dims.length - 1];
  const empty = new ort.Tensor("float32", new Float32Array(0), [0, 512]);
  const out = await session.run({
    input_ids: new ort.Tensor("int64", enc.input_ids.data, [1, n]),
    attention_mask: new ort.Tensor("int64", enc.attention_mask.data, [1, n]),
    image_features: empty, video_features: empty, audio_features: empty,
  });
  const v = Float32Array.from(out.sentence_embedding.data.slice(0, DIM));
  const norm = Math.hypot(...v);
  log("INFO", "query embedded", { tokens: n, ms: Math.round(performance.now() - t0) });
  return v.map(x => x / norm);
}

function topK(q, k) {
  const n = data.verses.length, scores = new Float32Array(n);
  for (let i = 0, off = 0; i < n; i++, off += DIM) {
    let s = 0;
    for (let j = 0; j < DIM; j++) s += q[j] * vectors[off + j];
    scores[i] = s;
  }
  return Array.from(scores.keys()).sort((a, b) => scores[b] - scores[a]).slice(0, k)
    .map(i => [i, scores[i]]);
}

function inSpan(c, v, from, to) {
  return (c > from[0] || (c === from[0] && v >= from[1])) &&
         (c < to[0] || (c === to[0] && v <= to[1]));
}

function crossRefs(verse) {
  const out = [];
  for (const [f1, b1, t1, f2, b2, t2] of xrefs) {
    if (b1 === verse.book && inSpan(verse.c, verse.v, f1, t1)) out.push([b2, f2, t2]);
    else if (b2 === verse.book && inSpan(verse.c, verse.v, f2, t2)) out.push([b1, f1, t1]);
  }
  return out;
}

function fmtRef(book, from, to) {
  const start = heRef(book, from[0], from[1]);
  if (from[0] === to[0] && from[1] === to[1]) return start;
  const end = to[0] === from[0] ? geresh(heNum(to[1])) : heRef(book, to[0], to[1]).replace(heBook(book) + " ", "");
  return `${start}–${end}`;
}

// Hebrew labels: book titles from the data, and numbers written as letters (gematria).
const HE_DIGITS = ["", "א", "ב", "ג", "ד", "ה", "ו", "ז", "ח", "ט"];
const HE_TENS = ["", "י", "כ", "ל", "מ", "נ", "ס", "ע", "פ", "צ"];
const HE_HUNDREDS = ["", "ק", "ר", "ש", "ת"];
function heNum(n) {
  let s = "";
  let rest = n;
  while (rest >= 400) { s += "ת"; rest -= 400; }
  if (rest >= 100) { s += HE_HUNDREDS[Math.floor(rest / 100)]; rest %= 100; }
  if (rest === 15) return s + "טו";      // not יה, which spells a divine name
  if (rest === 16) return s + "טז";
  return s + HE_TENS[Math.floor(rest / 10)] + HE_DIGITS[rest % 10];
}
// Geresh after a single letter (א׳), gershayim before the last letter of more (י״א).
const geresh = s => (s.length === 1 ? s + "׳" : s.slice(0, -1) + "״" + s.slice(-1));
function heBook(book) { return data.he_titles?.[book] || book; }
function heChapter(book, c) { return `${heBook(book)} ${geresh(heNum(c))}`; }
function heRef(book, c, v) { return `${heChapter(book, c)} ${geresh(heNum(v))}`; }

let english = {};                       // verse id -> English translation (JPS 1917)
let lastRender = null;   // the last result list, to return to from the chapter reader
function render(hits, key) {
  lastRender = { hits, key };
  resultsEl.textContent = "";
  for (const [i, score] of hits) {
    const verse = data.verses[i];
    const box = document.createElement("div");
    box.className = "verse";
    const ref = document.createElement("div");
    ref.className = "ref link";
    ref.textContent = heRef(verse.book, verse.c, verse.v);
    ref.title = "Open the chapter";
    ref.onclick = () => openChapter(i);
    const en = document.createElement("div");
    en.className = "en";
    en.textContent = english[verse.id] || "";
    if (score !== undefined) {
      const s = document.createElement("span");
      s.className = "score";
      s.textContent = score.toFixed(3);
      ref.append(s);
    }
    const he = document.createElement("div");
    he.className = "he";
    he.innerHTML = verse.he.split(" ").map(tok =>
      key && (key instanceof Set ? key.has(consonants(tok)) : consonants(tok) === key) ? `<mark>${tok}</mark>` : tok).join(" ");
    box.append(ref, he, en);
    const refs = crossRefs(verse);
    if (refs.length) {
      const x = document.createElement("div");
      x.className = "xrefs";
      x.append(`Cross-references (${refs.length}): `);
      for (const [b, f, t] of refs.slice(0, 12)) {
        const btn = document.createElement("button");
        btn.textContent = fmtRef(b, f, t);
        btn.onclick = () => openRef(b, f);
        x.append(btn);
      }
      box.append(x);
    }
    resultsEl.append(box);
  }
}

// Canonical order of the Tanakh, Genesis first (the data's book list is alphabetical).
const CANON = ["Genesis", "Exodus", "Leviticus", "Numbers", "Deuteronomy", "Joshua", "Judges",
  "I Samuel", "II Samuel", "I Kings", "II Kings", "Isaiah", "Jeremiah", "Ezekiel", "Hosea", "Joel",
  "Amos", "Obadiah", "Jonah", "Micah", "Nahum", "Habakkuk", "Zephaniah", "Haggai", "Zechariah",
  "Malachi", "Psalms", "Proverbs", "Job", "Song of Songs", "Ruth", "Lamentations", "Ecclesiastes",
  "Esther", "Daniel", "Ezra", "Nehemiah", "I Chronicles", "II Chronicles"];
const CANON_INDEX = new Map(CANON.map((b, i) => [b, i]));
let searchIndex = null;

// Word search: every word of the query, ranked by relevance (see docs/search.js).
function showWord(query) {
  const keys = queryKeys(query);
  if (keys.length === 0) { resultsEl.textContent = ""; return; }
  const ranked = rankWords(query, searchIndex);
  log("INFO", "word search", { query, words: keys.length, hits: ranked.length });
  statusEl.textContent = ranked.length
    ? `${ranked.length} matches (showing up to 200, by relevance)` : "Not found";
  render(ranked.slice(0, 200).map(([i]) => [i]), new Set(keys));
}

async function showMeaning(query) {
  const text = query.trim();
  if (!text) { resultsEl.textContent = ""; return; }
  if (!vectors) { statusEl.textContent = "Meaning search is not available yet"; return; }
  lastQuery = text;
  log("INFO", "meaning search", { query: text });
  if (!extractor) statusEl.textContent = "Loading the model…";
  const q = await embedQuery(text);
  if (lastQuery !== text) return;   // a newer query has replaced this one
  const t0 = performance.now();
  const hits = topK(q, 10);
  log("INFO", "ranked", { ms: Math.round(performance.now() - t0), top: hits.slice(0, 3).map(([i, s]) => data.verses[i].id + " " + s.toFixed(3)) });
  statusEl.textContent = "10 closest matches";
  render(hits, null);
}

function openRef(book, from) {
  const i = byId.get(`${book} ${from[0]}:${from[1]}`);
  if (i === undefined) return;
  input.value = "";
  openChapter(i);
}

// ---- Chapter reader ----------------------------------------------------------
// Chapters in canonical order, so reading moves on from Deuteronomy to Joshua and back.
let chapters = [], chapterOf = [], readerChapter = -1, readerFocus = -1;

function buildChapters() {
  const order = data.verses.map((_, i) => i).sort((a, b) => {
    const x = canonicalKey(a), y = canonicalKey(b);
    return x[0] - y[0] || x[1] - y[1] || x[2] - y[2];
  });
  chapters = [];
  chapterOf = new Array(data.verses.length);
  for (const i of order) {
    const v = data.verses[i];
    const last = chapters[chapters.length - 1];
    if (!last || last.book !== v.book || last.c !== v.c) chapters.push({ book: v.book, c: v.c, verses: [] });
    chapters[chapters.length - 1].verses.push(i);
    chapterOf[i] = chapters.length - 1;
  }
}

function canonicalKey(i) {
  const v = data.verses[i];
  return [CANON_INDEX.get(v.book) ?? 99, v.c, v.v];
}

function openChapter(i) {
  readerChapter = chapterOf[i];
  readerFocus = i;
  log("INFO", "chapter", { book: data.verses[i].book, c: data.verses[i].c, verse: data.verses[i].v });
  showChapter();
}

function showChapter() {
  const ch = chapters[readerChapter];
  resultsEl.textContent = "";

  const nav = document.createElement("div");
  nav.className = "reader-nav";
  const mk = (label, onclick, disabled = false) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = onclick;
    b.disabled = disabled;
    return b;
  };
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = heChapter(ch.book, ch.c);
  nav.append(
    // Hebrew reads right to left: the previous chapter is on the right, the next on the left.
    mk("Previous chapter →", () => moveChapter(-1), readerChapter <= 0),
    title,
    mk("← Next chapter", () => moveChapter(1), readerChapter >= chapters.length - 1),
    mk("Back to results", () => {
      if (!lastRender) return;
      render(lastRender.hits, lastRender.key);
      statusEl.textContent = `${lastRender.hits.length} results`;
    }),
  );
  resultsEl.append(nav);

  for (const i of ch.verses) {
    const v = data.verses[i];
    const line = document.createElement("div");
    line.className = "vline" + (i === readerFocus ? " focus" : "");
    const num = document.createElement("span");
    num.className = "vnum";
    num.textContent = geresh(heNum(v.v));
    const he = document.createElement("span");
    he.textContent = v.he;
    const en = document.createElement("div");
    en.className = "en";
    en.textContent = english[v.id] || "";
    line.append(num, he, en);
    resultsEl.append(line);
  }
  statusEl.textContent = `${heChapter(ch.book, ch.c)} · ${ch.verses.length} verses`;
  const focus = resultsEl.querySelector(".vline.focus");
  if (focus) focus.scrollIntoView({ block: "center" });
  else window.scrollTo(0, 0);
}

function moveChapter(step) {
  readerChapter += step;
  readerFocus = -1;
  showChapter();
}

function setMode(next) {
  log("INFO", "mode", next);
  input.placeholder = next === "meaning" ? "English phrase, e.g. God created the world" : "Hebrew word";
  mode = next;
  document.getElementById("mode-word").setAttribute("aria-pressed", String(next === "word"));
  document.getElementById("mode-meaning").setAttribute("aria-pressed", String(next === "meaning"));
  resultsEl.textContent = "";
  statusEl.textContent = next === "meaning" ? "Type an English phrase and press Enter" : `${data.verses.length} verses`;
}

document.getElementById("mode-word").onclick = () => setMode("word");
document.getElementById("mode-meaning").onclick = () => setMode("meaning");
input.addEventListener("input", e => { if (mode === "word") showWord(e.target.value); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && mode === "meaning") {
    showMeaning(e.target.value).catch(err => {
      log("ERROR", "meaning search failed", err);
      statusEl.textContent = "Error: " + err.message;
    });
  }
});

// Device checkbox: saved, then the page reloads so the chosen runtime is the only one loaded.
const gpuBox = document.getElementById("use-gpu");
gpuBox.checked = USE_GPU;
gpuBox.addEventListener("change", () => {
  try { localStorage.setItem("concordance-gpu", gpuBox.checked ? "1" : "0"); } catch (e) { /* private mode */ }
  log("STAGE", "device changed, reloading", { gpu: gpuBox.checked });
  location.reload();
});

// English translation checkbox: shown by default, saved per browser.
const showEn = document.getElementById("show-en");
try { showEn.checked = localStorage.getItem("concordance-en") !== "0"; } catch (e) { /* private mode */ }
document.body.classList.toggle("hide-en", !showEn.checked);
showEn.addEventListener("change", () => {
  document.body.classList.toggle("hide-en", !showEn.checked);
  try { localStorage.setItem("concordance-en", showEn.checked ? "1" : "0"); } catch (e) { /* private mode */ }
});

// Log panel buttons
document.getElementById("log-copy").onclick = async () => {
  const text = (prevLog ? "=== previous session ===\n" + prevLog + "\n=== this session ===\n" : "") + lines.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    statusEl.textContent = "Log copied";
  } catch (e) {
    const box = document.getElementById("logbox");
    box.focus(); getSelection().selectAllChildren(box);
    statusEl.textContent = "Select the log and copy it by hand";
  }
};
document.getElementById("log-prev").onclick = () => {
  document.getElementById("logpanel").open = true;
  document.getElementById("logbox").textContent = prevLog || "(no earlier log)";
};
document.getElementById("log-clear").onclick = () => {
  lines.length = 0; logSize = 0; prevLog = "";
  store(PREV_KEY, ""); store(LOG_KEY, "");
  renderLog();
};
document.getElementById("logpanel").addEventListener("toggle", renderLog);

loadData().then(() => setMode("word")).catch(err => {
  log("ERROR", "data load failed", err);
  statusEl.textContent = "Error loading the data: " + err;
});
</script>
</body>
</html>
